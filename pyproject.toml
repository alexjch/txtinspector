[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "txtinspect"
version = "0.1.0"
description = "A RAG application for document Q&A"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "llama-index-core>=0.9.0",
    "llama-index-embeddings-ollama==0.8.6",
    "llama-index-llms-ollama==0.9.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.scripts]
txtinspect = "txtinspect.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["txtinspect*"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
